<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PocketBoy">
<meta name="theme-color" content="#0b0c16">
<title>PocketBoy NEO</title>
<style>
  html, body {
    margin:0; height:100%; overflow:hidden; background:#0b0c16;
    touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    font-family:-apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; overscroll-behavior:none;
  }
  #shell {
    --hi:#2c2f4d; --bgA:#181a2b; --bgB:#0e0f1b; --bgC:#0a0b14; --glowL:rgba(63,240,255,.08); --glowR:rgba(255,63,180,.10); --tex:rgba(255,255,255,.022);
    --trim1:rgba(63,240,255,.55); --trim2:rgba(255,63,180,.55); --ink:#8a90b8; --lbl:#6d7299; --logo1:#3ff0ff; --logo2:#8a5cff; --logo3:#ff3fb4; --accent:#3ff0ff;
    --dp1:#40445f; --dp2:#1d1f2e; --dpsh:#07080d; --ring1:#1d1f30; --ring2:#0a0b13; --rec1:#0a0b13; --rec2:#161828; --pill1:#2d3048; --pill2:#191b2a; --grille:#05060b;
    --a1:#ff6ccb; --a2:#a80f72; --ag:#ff3fb4; --b1:#6cf7ff; --b2:#0d7f9c; --bgl:#3ff0ff; --bs:1;
    position:fixed; inset:0; box-sizing:border-box; display:grid;
    grid-template-columns:1fr 1fr; grid-template-rows:auto minmax(0,1fr) auto; grid-template-areas:"top top" "dpad ab" "sel start";
    padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 12px);
    background:
      radial-gradient(120% 55% at 50% 0%, var(--hi) 0%, rgba(0,0,0,0) 70%),
      radial-gradient(90% 50% at 85% 100%, var(--glowR), rgba(0,0,0,0) 70%),
      radial-gradient(90% 50% at 10% 85%, var(--glowL), rgba(0,0,0,0) 70%),
      linear-gradient(180deg, var(--bgA) 0%, var(--bgB) 60%, var(--bgC) 100%);
    overflow:hidden; transition:background .3s;
  }
  #shell::before { content:""; position:absolute; inset:0; pointer-events:none; background-image:repeating-linear-gradient(135deg, var(--tex) 0 2px, transparent 2px 7px); }
  #shell::after { content:""; position:absolute; inset:3px; border-radius:38px; pointer-events:none; padding:1.5px;
    background:linear-gradient(160deg, var(--trim1), rgba(138,92,255,.12) 35%, rgba(138,92,255,.08) 60%, var(--trim2));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
  #shell.notrim::after { display:none; }

  /* screen module */
  #top { grid-area:top; display:flex; flex-direction:column; min-height:0; min-width:0; position:relative; z-index:1; }
  #bezel { position:relative; display:flex; flex-direction:column; gap:7px; background:linear-gradient(180deg, #11121c, #06070b);
    border-radius:22px; padding:9px 10px 11px; box-shadow:0 0 0 1px rgba(255,255,255,.07), 0 14px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.09); }
  #status { display:flex; align-items:center; justify-content:space-between; padding:0 6px; gap:8px;
    font:700 9px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing:.16em; color:#8a90b8; white-space:nowrap; }
  #status .pwr { display:flex; align-items:center; gap:6px; }
  #status .pwr b { width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 6px 2px var(--accent); animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.45; } }
  #lvname { color:#e6e8ff; overflow:hidden; text-overflow:ellipsis; max-width:58%; }
  .sr { display:flex; align-items:center; gap:10px; }
  #gear { width:18px; height:18px; display:flex; align-items:center; justify-content:center; color:#8a90b8; cursor:pointer; margin:-6px -4px; padding:6px; }
  #gear svg { width:15px; height:15px; fill:currentColor; transition:transform .3s; }
  #gear:active svg { transform:rotate(60deg); color:var(--accent); }
  .bat { display:flex; gap:2px; align-items:center; padding:2px; border:1px solid #4a4f72; border-radius:3px; }
  .bat i { width:4px; height:7px; background:#5ef7a8; border-radius:1px; box-shadow:0 0 4px rgba(94,247,168,.6); }
  #wrap { flex:none; width:100%; aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; min-height:0; }
  .scr { position:relative; display:block; }
  #screen { display:block; image-rendering:pixelated; image-rendering:crisp-edges; border-radius:7px; background:#000;
    box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 0 26px rgba(120,160,255,.12); transition:filter .3s, border-radius .3s; }
  .glass { position:absolute; inset:0; border-radius:7px; pointer-events:none;
    background:linear-gradient(122deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,.03) 28%, rgba(255,255,255,0) 29%); box-shadow:inset 0 0 18px rgba(0,0,0,.45); }
  .fx-scan .glass { background:linear-gradient(122deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,.03) 28%, rgba(255,255,255,0) 29%), repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, rgba(0,0,0,0) 1px 3px); }
  .fx-lcd .glass { background:linear-gradient(122deg, rgba(255,255,255,.1) 0%, rgba(255,255,255,.02) 28%, rgba(255,255,255,0) 29%), repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, rgba(0,0,0,0) 1px 3px), repeating-linear-gradient(90deg, rgba(0,0,0,.14) 0 1px, rgba(0,0,0,0) 1px 3px); }
  .fx-crt #screen, .fx-crt .glass { border-radius:16px; }
  .fx-crt #screen { filter:saturate(1.3) contrast(1.08) brightness(1.05); }
  .fx-crt .glass { background:radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,.6) 100%), repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, rgba(0,0,0,0) 1px 3px), linear-gradient(122deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 30%); box-shadow:inset 0 0 30px rgba(0,0,0,.7); }
  .fx-green #screen { filter:grayscale(1) sepia(1) hue-rotate(38deg) saturate(2.4) brightness(.84) contrast(1.15); }
  .fx-green .glass { background:repeating-linear-gradient(0deg, rgba(0,40,0,.14) 0 1px, rgba(0,0,0,0) 1px 3px), repeating-linear-gradient(90deg, rgba(0,40,0,.14) 0 1px, rgba(0,0,0,0) 1px 3px); }
  #brand { display:flex; align-items:center; gap:9px; padding:10px 6px 0; }
  .logo { font:italic 900 clamp(17px,5vw,26px)/1 "Arial Black", "Helvetica Neue", Arial, sans-serif; letter-spacing:.02em;
    background:linear-gradient(90deg, var(--logo1), var(--logo2) 55%, var(--logo3)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tag { font:800 9px/1 ui-monospace, Menlo, monospace; letter-spacing:.2em; color:var(--accent); padding:4px 6px 3px; border:1px solid var(--accent); border-radius:5px; opacity:.85; }
  .grille { margin-left:auto; display:flex; gap:4px; }
  .grille i { width:4px; height:16px; border-radius:2px; background:var(--grille); box-shadow:inset 0 1px 2px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.08); }

  /* d-pad */
  #dpad { --d:calc(min(42vw, 29vh, 190px) * var(--bs)); grid-area:dpad; justify-self:center; align-self:center; width:var(--d); height:var(--d); position:relative; z-index:1; }
  .ring { position:absolute; inset:-9%; border-radius:50%; background:radial-gradient(circle at 50% 38%, var(--ring1), var(--ring2) 75%);
    box-shadow:inset 0 4px 10px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06), 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
  .cross { position:absolute; inset:0; transition:transform .05s; }
  .bar { position:absolute; border-radius:11px; background:linear-gradient(145deg, var(--dp1), var(--dp2)); box-shadow:0 6px 0 var(--dpsh), 0 11px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.14); }
  .bar.h { left:0; right:0; top:33.3%; height:33.4%; } .bar.v { top:0; bottom:0; left:33.3%; width:33.4%; }
  .arm { position:absolute; width:33.4%; height:33.4%; border-radius:10px; transition:background .05s; }
  .arm::after { content:""; position:absolute; left:50%; top:50%; width:0; height:0; border:7px solid transparent; transform:translate(-50%,-50%); transition:filter .05s; }
  .arm.u { left:33.3%; top:0 } .arm.u::after { border-bottom-color:rgba(255,255,255,.28); margin-top:-5px }
  .arm.d { left:33.3%; bottom:0 } .arm.d::after { border-top-color:rgba(255,255,255,.28); margin-top:5px }
  .arm.l { left:0; top:33.3% } .arm.l::after { border-right-color:rgba(255,255,255,.28); margin-left:-5px }
  .arm.r { right:0; top:33.3% } .arm.r::after { border-left-color:rgba(255,255,255,.28); margin-left:5px }
  #dpad.pu .arm.u, #dpad.pd .arm.d, #dpad.pl .arm.l, #dpad.pr .arm.r { background:rgba(255,255,255,.1); }
  #dpad.pu .arm.u::after { border-bottom-color:var(--accent); filter:drop-shadow(0 0 4px var(--accent)); }
  #dpad.pd .arm.d::after { border-top-color:var(--accent); filter:drop-shadow(0 0 4px var(--accent)); }
  #dpad.pl .arm.l::after { border-right-color:var(--accent); filter:drop-shadow(0 0 4px var(--accent)); }
  #dpad.pr .arm.r::after { border-left-color:var(--accent); filter:drop-shadow(0 0 4px var(--accent)); }
  .hub { position:absolute; left:39%; top:39%; width:22%; height:22%; border-radius:50%; background:radial-gradient(circle, var(--accent) 0 6%, #1a1c28 9%, #262838 70%); box-shadow:inset 0 2px 4px rgba(0,0,0,.6); opacity:.9; }

  /* A / B */
  #ab { --s:calc(min(46vw, 31vh, 215px) * var(--bs)); grid-area:ab; justify-self:center; align-self:center; position:relative; width:var(--s); height:calc(var(--s) * .72); transform:rotate(-20deg); z-index:1; }
  #ab::before { content:""; position:absolute; inset:4% -5%; border-radius:999px; background:linear-gradient(180deg, var(--rec1), var(--rec2)); box-shadow:inset 0 3px 8px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06); }
  .btn { position:absolute; width:43%; aspect-ratio:1; border-radius:50%;
    background:radial-gradient(circle at 34% 26%, rgba(255,255,255,.65) 0 6%, rgba(255,255,255,0) 26%), radial-gradient(circle at 50% 62%, var(--c1), var(--c2) 72%);
    box-shadow:0 0 0 4px rgba(0,0,0,.35), 0 0 0 5px rgba(255,255,255,.08), 0 7px 0 4px rgba(0,0,0,.55), 0 13px 22px rgba(0,0,0,.5), inset 0 -7px 12px rgba(0,0,0,.35);
    transition:transform .05s, box-shadow .05s; display:flex; align-items:center; justify-content:center; }
  .btn span { font:900 clamp(18px,5.5vw,26px)/1 "Arial Black", Arial, sans-serif; color:rgba(255,255,255,.92); text-shadow:0 1px 2px rgba(0,0,0,.45); transform:rotate(20deg); }
  .btn::after { content:""; position:absolute; inset:-5px; border-radius:50%; border:2px solid var(--glow); opacity:0; pointer-events:none; }
  #btnA { --c1:var(--a1); --c2:var(--a2); --glow:var(--ag); right:1%; top:3%; }
  #btnB { --c1:var(--b1); --c2:var(--b2); --glow:var(--bgl); left:1%; bottom:5%; }
  .btn.pressed { transform:translateY(4px) scale(.97); box-shadow:0 0 0 4px rgba(0,0,0,.35), 0 0 0 5px var(--glow), 0 3px 0 4px rgba(0,0,0,.55), 0 0 28px 6px var(--glow), inset 0 -3px 10px rgba(0,0,0,.4); }
  .btn.pressed::after { animation:ring .35s ease-out; }
  @keyframes ring { from { opacity:.9; transform:scale(.92); } to { opacity:0; transform:scale(1.4); } }
  .lbl { position:absolute; font:800 9px/1 ui-monospace, Menlo, monospace; letter-spacing:.22em; font-style:normal; }
  .lbl.la { right:9%; top:-11%; color:var(--ag); } .lbl.lb { left:10%; bottom:-12%; color:var(--bgl); }

  /* start / select */
  .pillwrap { display:flex; flex-direction:column; align-items:center; gap:7px; align-self:end; z-index:1; position:relative; }
  .pill { width:calc(min(19vw, 78px) * var(--bs)); height:24px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, var(--pill1), var(--pill2)); color:var(--ink);
    box-shadow:0 4px 0 rgba(0,0,0,.5), 0 6px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.14), 0 0 0 1px rgba(255,255,255,.06); transition:transform .05s, box-shadow .05s; }
  .pill svg { width:12px; height:12px; fill:currentColor; }
  .pill.pressed { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.5), 0 0 0 1px var(--accent), 0 0 18px var(--accent), inset 0 1px 0 rgba(255,255,255,.12); }
  .pillwrap span { font:800 8px/1 ui-monospace, Menlo, monospace; letter-spacing:.24em; color:var(--lbl); }
  #sel { grid-area:sel; justify-self:end; margin-right:5vw; } #start { grid-area:start; justify-self:start; margin-left:5vw; }
  #tip { position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom) + 2px); transform:translateX(-50%); font-size:10px; color:var(--lbl); white-space:nowrap; opacity:0; transition:opacity .6s; pointer-events:none; }
  #hap { position:absolute; left:-9999px; top:0; opacity:0; }

  /* loading screen */
  #loader { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(80% 60% at 50% 40%, #1d1f3a 0%, #090a14 70%); transition:opacity .6s ease, transform .6s ease; }
  #loader.done { opacity:0; transform:scale(1.04); pointer-events:none; }
  #loader::before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(135deg, rgba(255,255,255,.02) 0 2px, transparent 2px 7px); }
  .lwrap { position:relative; width:min(78vw, 420px); display:flex; flex-direction:column; align-items:center; gap:16px; }
  .lcart { width:64px; height:80px; border-radius:6px 14px 6px 6px; background:linear-gradient(160deg, #3a3f66, #1d2040); position:relative;
    box-shadow:0 10px 30px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.15); animation:insert 1.4s cubic-bezier(.5,0,.3,1) both; }
  .lcart::before { content:""; position:absolute; left:8px; right:8px; top:12px; height:40px; border-radius:3px; background:linear-gradient(135deg, #3ff0ff, #8a5cff 50%, #ff3fb4); box-shadow:0 0 18px rgba(138,92,255,.6); }
  .lcart::after { content:""; position:absolute; left:20px; right:20px; bottom:8px; height:12px; background:repeating-linear-gradient(90deg, #0d0f22 0 3px, transparent 3px 6px); }
  @keyframes insert { from { transform:translateY(-40px) rotate(-8deg); opacity:0; } to { transform:none; opacity:1; } }
  .llogo { font:italic 900 clamp(30px, 10vw, 54px)/1 "Arial Black", "Helvetica Neue", Arial, sans-serif; letter-spacing:.01em;
    background:linear-gradient(90deg, #3ff0ff, #8a5cff 45%, #ff3fb4 70%, #3ff0ff); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 2.4s linear infinite; filter:drop-shadow(0 0 14px rgba(138,92,255,.45)); }
  @keyframes shine { to { background-position:-200% 0; } }
  .lneo { font:800 12px/1 ui-monospace, Menlo, monospace; letter-spacing:.6em; color:#cfd6ff; margin-top:-6px; padding-left:.6em; }
  .lbar { width:100%; height:8px; border-radius:6px; background:#0b0c18; box-shadow:inset 0 1px 3px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.08); overflow:hidden; }
  .lbar i { display:block; height:100%; width:0; border-radius:6px; background:linear-gradient(90deg, #3ff0ff, #8a5cff, #ff3fb4); box-shadow:0 0 12px rgba(63,240,255,.7); transition:width .12s linear; }
  .lrow { width:100%; display:flex; justify-content:space-between; font:700 10px/1 ui-monospace, Menlo, monospace; letter-spacing:.16em; color:#8a90b8; }
  #lpct { color:#e6e8ff; }

  @media (orientation:landscape) {
    #shell { grid-template-columns:1fr auto 1fr; grid-template-rows:minmax(0,1fr) auto; grid-template-areas:"dpad top ab" "sel top start";
      padding-top:calc(env(safe-area-inset-top) + 8px); padding-bottom:calc(env(safe-area-inset-bottom) + 8px); }
    #top { width:min(58vw, calc((100vh - 74px) * 1.7778 + 20px)); width:min(58vw, calc((100dvh - 74px) * 1.7778 + 20px)); align-self:center; }
    #brand { display:none; }
    #dpad { --d:calc(min(14.5vw, 38vh, 180px) * var(--bs)); }
    #ab { --s:calc(min(16vw, 42vh, 210px) * var(--bs)); }
    #sel, #start { justify-self:center; margin:0 0 4px; }
  }
</style>
</head>
<body>
<div id="loader"><div class="lwrap">
  <div class="lcart"></div>
  <div class="llogo">POCKETBOY</div><div class="lneo">NEO</div>
  <div class="lbar"><i id="lfill"></i></div>
  <div class="lrow"><span id="lmsg">STARTING UP</span><span id="lpct">0%</span></div>
</div></div>
<div id="shell">
  <div id="top">
    <div id="bezel">
      <div id="status"><span class="pwr"><b></b>PWR</span><span id="lvname">POCKETBOY NEO</span>
        <span class="sr"><span id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm9 3.5c0-.6-.1-1.2-.2-1.7l2-1.6-2-3.4-2.4 1a8 8 0 0 0-3-1.7L15 2h-4l-.4 2.6a8 8 0 0 0-3 1.7l-2.4-1-2 3.4 2 1.6a8 8 0 0 0 0 3.4l-2 1.6 2 3.4 2.4-1a8 8 0 0 0 3 1.7L11 22h4l.4-2.6a8 8 0 0 0 3-1.7l2.4 1 2-3.4-2-1.6c.1-.5.2-1.1.2-1.7z"/></svg></span>
        <span class="bat"><i></i><i></i><i></i></span></span></div>
      <div id="wrap"><div class="scr"><canvas id="screen"></canvas><div class="glass"></div></div></div>
    </div>
    <div id="brand"><span class="logo">POCKETBOY</span><span class="tag">NEO</span><span class="grille"><i></i><i></i><i></i><i></i><i></i></span></div>
  </div>

  <div id="dpad"><div class="ring"></div><div class="cross">
    <div class="bar h"></div><div class="bar v"></div>
    <div class="arm u"></div><div class="arm d"></div><div class="arm l"></div><div class="arm r"></div>

  </div></div>

  <div id="ab">
    <div class="btn" id="btnB"><span>B</span></div>

  </div>

  <div class="pillwrap" id="sel"><div class="pill" id="btnSelect"><svg viewBox="0 0 12 12"><rect x="1" y="2" width="10" height="1.6" rx=".8"/><rect x="1" y="5.2" width="10" height="1.6" rx=".8"/><rect x="1" y="8.4" width="10" height="1.6" rx=".8"/></svg></div><span>SELECT</span></div>

  <div id="tip">Tip: Share → Add to Home Screen for full-screen play</div>
  <label id="hap"><input type="checkbox" switch></label>
</div>

<script>
(() => {
'use strict';
// =====================================================================
//  CONSTANTS
// =====================================================================
const W = 384, H = 216, T = 16, ROWS = 14, CAMY = 8;
const RUN_MAX = 2.2, WALK_MAX = 1.35;   // hard speed caps (px / frame)
const $ = s => document.querySelector(s);
const cv = $('#screen'); cv.width = W; cv.height = H;
let g = cv.getContext('2d'); g.imageSmoothingEnabled = false;

// =====================================================================
//  HELPERS
// =====================================================================
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; }
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function pcircle(x, cx, cy, r, col) { x.fillStyle = col; for (let dy = -r; dy <= r; dy++) { const dx = Math.round(Math.sqrt(Math.max(0, r * r - dy * dy))); x.fillRect(cx - dx, cy + dy, dx * 2 + 1, 1); } }
function ptri(x, cx, top, h, w, col) { x.fillStyle = col; for (let i = 0; i < h; i++) { const ww = Math.round(w * (i + 1) / h); x.fillRect(cx - ww, top + i, ww * 2 + 1, 1); } }
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad = (n, l) => String(Math.max(0, Math.floor(n))).padStart(l, '0');
const overlap = (a, b, m = 0) => a.x + m < b.x + b.w - m && a.x + a.w - m > b.x + m && a.y + m < b.y + b.h - m && a.y + a.h - m > b.y + m;

// =====================================================================
//  PIXEL FONT (3x5)

function moveBody(b, onHead, corner) {

// ---------- player ----------
function updatePlayer() {

    P.face = dir;

  if (P.ground && !wasGround && fallV > 3) puff(P.x + 5, P.y + P.h, 4, ['#e8dcc4', '#c9b796'], .8, 0, 14);
  if (P.ground) P.combo = 0;

  if (P.inv > 0) P.inv--;

  if (P.power && frame % 9 === 0) puff(P.x + Math.random() * 10, P.y + Math.random() * 14, 1, ['#ffd23f', '#fff6c0'], .3, 0, 20);

}
function foxFrame() {

// ---------- update: play ----------
function updatePlay() {

      if (!P.power) { P.power = true; sfx('power'); puff(P.x + 5, P.y + 7, 16, ['#ffd23f', '#fff', '#ff9a3a'], 1.8, 0, 26); } else sfx('gem'); }
    if (it.y > ROWS * T + 20) it.gone = true;
  }
  items = items.filter(i => !i.gone);
  for (const e of ents) {
    if (e.dead) { e.dead++; if (e.flip) { e.vy += .25; e.x += e.vx; e.y += e.vy; if (e.y > H + 40) e.gone = true; } else if (e.dead > 30) e.gone = true; continue; }
    if (!e.active) { if (e.x < camX + W + 24) e.active = true; else continue; }
    e.vy = Math.min(e.vy + .3, 4);
    if (e.type === 'K' && e.ground) { const ahead = e.vx > 0 ? e.x + e.w + 1 : e.x - 1, c = tileAt(Math.floor(ahead / T), Math.floor((e.y + e.h + 2) / T));
      if (!solid(c) && c !== '=') e.vx = -e.vx; }
    if (moveBody(e)) e.vx = -e.vx;
    e.anim++;
    if (e.y > ROWS * T + 32 || e.x + e.w < camX - 64) e.gone = true;
  }
  for (let i = 0; i < ents.length; i++) for (let j = i + 1; j < ents.length; j++) {
    const a = ents[i], b = ents[j]; if (!a.active || !b.active || a.dead || b.dead) continue;

  }
  for (const e of ents) {

  }
  ents = ents.filter(e => !e.gone);

  if (P.x + P.w > LV.goal * T + 4) { state = 'clear'; clearT = 0; clearReady = false; sfx('win'); }
  if (frame % 24 === 0) { time--; if (time === 100 && !hurried) { hurried = true; sfx('hurry'); toast = 'HURRY UP!'; toastT = 100; } if (time <= 0) { time = 0; die(false); } }

}
function updateCamera() { camX += (P.x + P.w / 2 - W * .4 - camX) * .15; camX = clamp(camX, 0, LV.cols * T - W); }
function updateFx() {
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += p.g; if (!p.g) { p.vx *= .92; p.vy *= .92; } p.life--; }

  pops = pops.filter(p => p.kind === 'gem' ? p.t < 24 : p.t < 45);
  for (const b of bumps) b.t++;
  bumps = bumps.filter(b => b.t < 10);
  if (toastT > 0) toastT--;
}

}

}

  for (let i = 0; i < 28; i++) { const a = i / 28 * Math.PI * 2, s = 1.6 + Math.random() * .4;

let pauseSel = 0;

      if (pressed('start') || pressed('a')) beginGame(menuSel === 1 ? saved : 1);
      if (pressed('select')) toggleMusic(); if (toastT > 0) toastT--; break;
    case 'intro': introT++; if (introT > 120 || (introT > 30 && (pressed('start') || pressed('a')))) { state = 'play'; mNext = 0; saveProgress(); } break;
    case 'play':

      updatePlay(); break;
    case 'pause':
      if (rep('up')) { pauseSel = (pauseSel + 2) % 3; sfx('select'); } if (rep('down')) { pauseSel = (pauseSel + 1) % 3; sfx('select'); }
      if (pressed('start')) { state = 'play'; sfx('pause'); }

      if (pressed('select')) toggleMusic(); if (toastT > 0) toastT--; break;
    case 'dying': updateDying(); break;
    case 'clear': updateClear(); break;

    case 'ending': endT++; if (endT % 26 === 0) firework(30 + Math.random() * (W - 60), 24 + Math.random() * 80); updateFx();
      if (endT > 120 && (pressed('start') || pressed('a'))) { loop++; lvl = 1; checkpoint = false; startLevel(); state = 'intro'; introT = 0; } break;
  }

}

}
function drawBG(cx) {

function drawDeco(sx, sy, h) {

      g.fillStyle = ['#ff5e7e', '#ffd23f', '#ffffff', '#8ad1ff'][(h >> 3) % 4]; g.fillRect(sx + 4, sy - 5, 3, 1); g.fillRect(sx + 5, sy - 6, 1, 3);
      g.fillStyle = '#ffe14a'; g.fillRect(sx + 5, sy - 5, 1, 1); }

    g.fillStyle = c; g.fillRect(sx + 7, sy - 5, 2, 5); g.fillRect(sx + 9, sy - 3, 2, 3); g.fillStyle = '#fff'; g.fillRect(sx + 7, sy - 5, 1, 2); }
}
